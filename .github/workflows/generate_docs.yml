name: generate-docs

on:
  push:

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e "./app[test]"
      - name: Run verification and generate docs
        run: |
          mkdir -p docs
          echo "# Phase 2 Verification Summary" > docs/phase2_verification.md
          echo "## Wheels Verification" >> docs/phase2_verification.md
          echo "\`\`\`" >> docs/phase2_verification.md
          python app/tools/verify_wheels.py >> docs/phase2_verification.md 2>&1
          echo "\`\`\`" >> docs/phase2_verification.md
          echo "## Imports Verification (Full Sweep)" >> docs/phase2_verification.md
          echo "\`\`\`" >> docs/phase2_verification.md
          python app/tools/verify_imports.py >> docs/phase2_verification.md 2>&1
          echo "\`\`\`" >> docs/phase2_verification.md
      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/phase2_verification.md
          git commit -m "docs: generate phase 2 verification summary"
          git push
